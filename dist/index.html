<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>strongco.de</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet" type="text/css">
  <script type="module" src="main.js"></script>
</head>

<body>


  <div class="header-container">
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <img id="darkmodeToggle" src="assets/icons/darkmode.png" alt="">
    </button>
    <span id="dateContainer" class="right-span">
      <a href="https://calendar.google.com/calendar/u/0/r">
        <span id="dateTop">
        </span>
      </a>
      <span id="build"></span>
      <span id="gallery"> 
        <br><br>
        RECENT PASTES: <a href="#" id="older" batch=1>></a>
        <ul id="paste-list">
        </ul>
        <div class="popup" style="display:none;"></div>
      </span>
    </span>
    <span id="apiStatus" class="left-span"></span>
  </div>

  <aside id="notesWidget" class="notes-widget" aria-label="Notes">
    <div class="notes-heading">
      <div>
        <span class="notes-kicker">PERSONAL</span>
        <h2>Notes</h2>
      </div>
      <button id="notesCollapse" class="notes-icon-button" type="button" aria-label="Collapse notes" aria-expanded="true">-</button>
    </div>
    <div id="notesContent" class="notes-content">
      <div class="notes-actions">
        <button id="addNote" class="notes-action notes-action-primary" type="button">+ New note</button>
        <button id="exportNotes" class="notes-action" type="button">Export</button>
        <button id="importNotes" class="notes-action" type="button">Import</button>
        <input id="notesFile" type="file" accept="application/json,.json" hidden>
      </div>
      <div id="notesList" class="notes-list"></div>
      <p id="notesEmpty" class="notes-empty">No notes yet. Start with a quick thought.</p>
    </div>
  </aside>

  <aside id="trackingWidget" class="tracking-widget" aria-label="Shipment tracking" hidden>
    <div class="tracking-heading">
      <div>
        <span class="tracking-kicker">INBOUND</span>
        <h2>Shipments</h2>
      </div>
      <button id="trackingClose" class="tracking-icon-button" type="button" aria-label="Close tracking">x</button>
    </div>
    <div id="trackingContent" class="tracking-content">
      <form id="trackingAddForm" class="tracking-add-form" hidden>
        <input type="text" id="trackingNumberInput" placeholder="tracking number" autocomplete="off" spellcheck="false">
        <input type="text" id="trackingItemInput" placeholder="description (optional)" autocomplete="off">
        <div class="tracking-carrier-row">
          <span id="trackingCarrierHint" class="tracking-carrier-hint"></span>
          <select id="trackingCarrierSelect" hidden></select>
        </div>
      </form>
      <button type="button" id="trackingAddBtn" class="tracking-action tracking-action-primary">+ Track</button>
      <div id="trackingStatus" class="tracking-status"></div>
      <div id="trackingList" class="tracking-list"></div>
      <button type="button" id="trackingDeliveriesBtn" class="tracking-action tracking-deliveries-btn" hidden>deliveries <span class="tracking-deliveries-arrow">▼</span></button>
      <div id="trackingDeliveries" class="tracking-deliveries" hidden></div>
      <p id="trackingEmpty" class="tracking-empty">No active shipments. Add one above.</p>
    </div>
  </aside>

  <div class="container" id="main">
    <h2 id="welcomeMsg">welcome home</h2>

    <div id="weather"></div>
    <div id="futures"></div>
    <div id="search">
     <div class="search-shell">
       <span class="search-prompt" aria-hidden="true">&gt;</span>
       <input tabindex="1" type="text" id="searchBar" aria-label="Search">
       <span class="search-hint">enter</span>
     </div>

      <div class="container" id="buttonContainer">
        <div class="menu-item">
            <img src="assets/icons/download.png" class="icon menu-icon" tabindex="0" alt="">
            <div class="dropdown-container" id="downloads">
            </div>
        </div>
        <div class="menu-item">
            <img src="assets/icons/4chan.png" class="icon menu-icon" tabindex="0" alt="">
            <div class="dropdown-container" id="4chan">
            </div>
        </div>
        <div class="menu-item">
            <img src="assets/icons/computer.png" class="icon menu-icon" tabindex="0" alt="">
            <div class="dropdown-container" id="coding">
            </div>
        </div>
        <div class="menu-item">
            <img src="assets/icons/gaming.png" class="icon menu-icon" tabindex="0" alt="">
            <div class="dropdown-container" id="gaming">
            </div>
        </div>
        <div class="menu-item">
            <img src="assets/icons/leisure.png" class="icon menu-icon" tabindex="0" alt="">
            <div class="dropdown-container" id="leisure">
            </div>
        </div>
        <div class="menu-item">
            <img src="assets/icons/business.png" class="icon menu-icon" tabindex="0" alt="">
            <div class="dropdown-container" id="business">
            </div>
        </div>

      </div>

      <div id="ocResult"></div>
    </div>
  </div>

  <div id="footer"></div>

</body>
</html>
